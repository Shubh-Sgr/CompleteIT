name: completeit
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: completeit
      POSTGRES_PASSWORD: completeit
      POSTGRES_DB: completeit
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U completeit"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: completeit
      MINIO_ROOT_PASSWORD: completeit-local-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  create-bucket:
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "until mc alias set local http://minio:9000 completeit completeit-local-secret; do sleep 1; done; mc mb --ignore-existing local/completeit; mc anonymous set download local/completeit/products; exit 0"]
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
volumes:
  postgres_data:
  redis_data:
  minio_data:
